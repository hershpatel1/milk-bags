<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milk Bags</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#00B3B2; --teal-dark:#007D7D; --teal-deep:#006262; --teal-light:#B2E8E8; --teal-surface:#E6F7F7;
  --carmine:#D93B5C; --carmine-dark:#C33553; --carmine-light:#FBEBEF;
  --grey-dark:#757575; --grey-light:#CCCCCC; --bg:#f4f5f7; --bg2:#eef0f3; --ink:#202124;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Open Sans","Segoe UI",Arial,sans-serif;font-weight:400;line-height:1.5;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--teal-dark)}
h1{font-weight:300;font-size:clamp(28px,7vw,40px);letter-spacing:-.015em;margin:2px 0 8px}
.hair{height:1px;border:0;background:linear-gradient(90deg,var(--carmine),var(--teal));margin:14px 0 18px}
.status{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg2);color:var(--grey-dark)}
.status.ok{background:var(--teal-surface);color:var(--teal-dark)}
.status.bad{background:var(--carmine-light);color:var(--carmine-dark)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 20px}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;min-width:0}
.stat{padding:14px}
.stat .v{font-size:clamp(20px,6vw,30px);font-weight:300;white-space:nowrap;color:var(--teal-deep)}
.stat .l{font-size:12px;color:var(--grey-dark)}
.next{padding:16px;margin-bottom:20px;border:1px solid var(--teal-light)}
.next .big{font-size:clamp(20px,5.5vw,26px);font-weight:300;margin:2px 0}
.next .sub{color:var(--grey-dark);font-size:14px}
h2{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--teal-dark);margin:22px 0 8px}
.bag{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid #e8eaed}
.bag:last-child{border-bottom:0}
.bag.isnext{background:var(--teal-surface)}
.d{font-weight:600}
.meta{font-size:13px;color:var(--grey-dark)}
.meta .warn{color:var(--carmine-dark);font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:1px 8px;border-radius:999px;background:var(--teal-dark);color:#fff;margin-left:6px;vertical-align:middle}
.chk{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;min-height:44px;cursor:pointer;font-size:11px;font-weight:600;color:var(--grey-dark);text-transform:uppercase;letter-spacing:.04em;user-select:none}
.chk input{appearance:none;-webkit-appearance:none;width:28px;height:28px;border:2px solid var(--grey-light);border-radius:8px;margin:0 0 2px;background:#fff;cursor:pointer;position:relative}
.chk input:checked{background:var(--teal-dark);border-color:var(--teal-dark)}
.chk input:checked::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.used-list .bag{opacity:.65}
.add{display:flex;gap:8px;flex-wrap:wrap;padding:14px}
.add input[type=date]{flex:1;min-width:150px;font:inherit;font-size:16px;padding:10px;border:1px solid var(--grey-light);border-radius:10px;min-height:44px}
button{font:inherit;font-size:16px;font-weight:600;min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--teal-dark);color:#fff;cursor:pointer}
button.ghost{background:none;color:var(--carmine-dark);font-size:13px;min-height:44px;padding:0 6px}
.empty{padding:16px;color:var(--grey-dark);font-size:14px}
.note{font-size:12px;color:var(--grey-dark);margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Freezer stock</div>
  <h1>Milk bags</h1>
  <span id="status" class="status">Connecting...</span>
  <hr class="hair">

  <div class="stats">
    <div class="card stat"><div class="v" id="sLeft">-</div><div class="l">Bags left</div></div>
    <div class="card stat"><div class="v" id="sMl">-</div><div class="l">Litres left</div></div>
    <div class="card stat"><div class="v" id="sDef">-</div><div class="l">Defrosted</div></div>
  </div>

  <div class="card next" id="next"></div>

  <h2>In the freezer - oldest first</h2>
  <div class="card" id="list"></div>

  <h2>Used</h2>
  <div class="card used-list" id="used"></div>

  <h2>Add a bag</h2>
  <div class="card add">
    <input type="date" id="newDate" aria-label="Date expressed">
    <button id="addBtn">Add bag</button>
  </div>

  <p class="note">250ml per bag. Use by date is 6 months after the date the bag was frozen. Ticking Used also ticks Defrosted.</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// Firebase config for the milk-bags project
const firebaseConfig = {
  apiKey: "AIzaSyAJdmMsW6d9O9V7vsqDpwGrEU4Pk2racXg",
  authDomain: "milk-bags.firebaseapp.com",
  projectId: "milk-bags",
  storageBucket: "milk-bags.firebasestorage.app",
  messagingSenderId: "543958473721",
  appId: "1:543958473721:web:43d929adba9c9087103b28"
};

const ML = 250, COLL = "milkbags";
const SEED = ["2026-04-01","2026-04-10","2026-04-13","2026-04-14","2026-04-15","2026-04-18","2026-04-19","2026-04-22","2026-04-23","2026-04-25","2026-04-28","2026-04-29",
"2026-05-02","2026-05-05","2026-05-05","2026-05-06","2026-05-07","2026-05-08","2026-05-10","2026-05-11","2026-05-16","2026-05-21","2026-05-22","2026-05-23","2026-05-24","2026-05-27","2026-05-28","2026-05-29","2026-05-30","2026-05-31",
"2026-06-18"];

const $ = id => document.getElementById(id);
const setStatus = (t, cls) => { const s = $("status"); s.textContent = t; s.className = "status " + (cls || ""); };

function parse(iso){ const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); }
function expiry(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const e = new Date(y, m-1+6, d);
  if (e.getDate() !== d) e.setDate(0);
  return e;
}
const fmt = d => d.toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short", year:"numeric"});
function daysLeft(iso){
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((expiry(iso) - t) / 86400000);
}

let db, bags = [];

function row(b, isNext){
  const dl = daysLeft(b.date);
  let left;
  if (dl < 0) left = `<span class="warn">Past 6 months by ${-dl} day${dl===-1?"":"s"}</span>`;
  else if (dl <= 14) left = `<span class="warn">${dl} day${dl===1?"":"s"} left</span>`;
  else left = `${dl} days left`;
  return `<div class="bag ${isNext?"isnext":""}">
    <div>
      <div class="d">${fmt(parse(b.date))}${isNext?'<span class="tag">Use next</span>':""}</div>
      <div class="meta">Use by ${fmt(expiry(b.date))} - ${left}</div>
    </div>
    <label class="chk"><input type="checkbox" data-id="${b.id}" data-f="defrosted" ${b.defrosted?"checked":""}>Defrosted</label>
    <label class="chk"><input type="checkbox" data-id="${b.id}" data-f="used" ${b.used?"checked":""}>Used</label>
  </div>`;
}

function render(){
  const sorted = [...bags].sort((a,b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  const active = sorted.filter(b => !b.used);
  const used = sorted.filter(b => b.used).reverse();
  $("sLeft").textContent = active.length;
  $("sMl").textContent = (active.length * ML / 1000).toFixed(2);
  $("sDef").textContent = active.filter(b => b.defrosted).length;

  const n = active[0];
  $("next").innerHTML = n
    ? `<div class="eyebrow">Use next</div><div class="big">${fmt(parse(n.date))}</div>
       <div class="sub">Use by ${fmt(expiry(n.date))}${n.defrosted ? " - already defrosted" : ""}</div>`
    : `<div class="eyebrow">Use next</div><div class="big">No bags left</div>`;

  $("list").innerHTML = active.length ? active.map((b,i) => row(b, i===0)).join("") : '<div class="empty">Nothing in the freezer.</div>';
  $("used").innerHTML = used.length ? used.map(b => row(b,false)).join("") : '<div class="empty">No bags used yet.</div>';
}

document.addEventListener("change", async e => {
  const el = e.target;
  if (!el.matches("input[data-id]")) return;
  const id = el.dataset.id, f = el.dataset.f, v = el.checked;
  const upd = {[f]: v};
  if (f === "used" && v) upd.defrosted = true;
  if (f === "defrosted" && !v) upd.used = false;
  try { await updateDoc(doc(db, COLL, id), upd); }
  catch(err){ console.error(err); setStatus("Save failed - check connection", "bad"); render(); }
});

$("addBtn").addEventListener("click", async () => {
  const v = $("newDate").value;
  if (!v) return;
  const id = v + "-" + Date.now();
  try {
    await setDoc(doc(db, COLL, id), {date: v, defrosted: false, used: false});
    $("newDate").value = "";
  } catch(err){ console.error(err); setStatus("Save failed - check connection", "bad"); }
});

async function start(){
  if (firebaseConfig.apiKey === "PASTE_ME"){ setStatus("Firebase config not added yet", "bad"); render(); return; }
  try {
    const app = initializeApp(firebaseConfig);
    await signInAnonymously(getAuth(app));
    db = getFirestore(app);

    const metaRef = doc(db, "milkbags_meta", "seed");
    const meta = await getDoc(metaRef);
    if (!meta.exists()){
      const batch = writeBatch(db);
      const seen = {};
      SEED.forEach(d => {
        seen[d] = (seen[d] || 0) + 1;
        batch.set(doc(db, COLL, d + "-" + seen[d]), {date: d, defrosted: false, used: false});
      });
      batch.set(metaRef, {seeded: true});
      await batch.commit();
    }

    onSnapshot(collection(db, COLL), snap => {
      bags = snap.docs.map(x => ({id: x.id, ...x.data()}));
      render();
      setStatus("Connected", "ok");
    }, err => { console.error(err); setStatus("Connection error", "bad"); });
  } catch(err){
    console.error(err);
    setStatus("Connection error", "bad");
  }
}
render();
start();
</script>
</body>
</html>
